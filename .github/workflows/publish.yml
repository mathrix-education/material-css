name: publish
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v1
      - name: Setup Node.js 12.x
        uses: actions/setup-node@v1
        with:
          node-version: 12.x
          registery-url: 'https://npm.pkg.github.com'
      - name: Publish
        run: |
          REF="${{ github.ref }}"
          BRANCH=$(echo "${REF}" | sed "s|refs/heads/||g" | sed "s|\/|-|g")
          SHA="${{ github.sha }}"
          SHORT_SHA=${SHA:0:7}
          BUILD="${BRANCH}-${SHORT_SHA}"
          if [[ "${BRANCH}" != "master" ]]; then
            jq ".version = .version + \"-${BUILD}\"" package.json > package.json.tmp
            mv package.json.tmp package.json
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
